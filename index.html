<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web OS - Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="desktop">
        <div class="window" id="welcome-window">
            <div class="title-bar">
                <span>✨ Welkom in Web OS</span>
                <div class="controls">
                    <button class="close-btn">X</button>
                </div>
            </div>
            <div class="content">
                <p>Dit is de Web OS interface. Vervang de placeholder-tekst door jouw eigen apps en info!</p>
            </div>
        </div>
        
        <div class="desktop-icon">
            <img src="icon-folder.png" alt="Mijn Documenten" class="icon-image"> 
            <span>Mijn Documenten</span>
        </div>
        <div class="desktop-icon" style="top: 100px;">
            <img src="icon-browser.png" alt="Browser" class="icon-image">
            <span>Web Browser</span>
        </div>
    </div>

    <div id="taskbar">
        <div id="taskbar-icons">
            <div id="start-button">
                <img src="start-icon-vloeibaar.png" alt="Start" class="icon-image">
            </div>

            <div class="taskbar-app-icon active">
                <img src="app-settings.png" alt="Settings" class="icon-image">
            </div>
            <div class="taskbar-app-icon">
                <img src="app-music.png" alt="Music" class="icon-image">
            </div>
        </div>

        <div id="system-tray">
            <span id="os-time">12:59 PM</span>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('os-time').textContent = timeString;
        }

        setInterval(updateTime, 1000);
        updateTime();

        document.querySelector('.close-btn').addEventListener('click', function() {
            document.getElementById('welcome-window').style.display = 'none';
        });
    </script>
</body>
</html>
