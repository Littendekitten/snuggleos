<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web OS - Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="desktop">
        <div class="window" id="welcome-window">
            <div class="title-bar">
                <span>✨ Welkom in Web OS</span>
                <div class="controls">
                    <button class="close-btn">X</button>
                </div>
            </div>
            <div class="content">
                <p>Dit is een demo van de interface van je nieuwe OS, gebouwd met de minimalistische, lichte stijl van jouw referentiefoto!</p>
                <p>Probeer het venster te sluiten met de X.</p>
            </div>
        </div>

    </div>

    <div id="taskbar">
        <div id="taskbar-icons">
            <div id="start-button">
                <div class="liquid-squares">
                    <div class="square top-left"></div>
                    <div class="square top-right"></div>
                    <div class="square bottom-left"></div>
                    <div class="square bottom-right"></div>
                </div>
            </div>
            <div class="taskbar-app-icon active"></div>
            <div class="taskbar-app-icon"></div>
        </div>

        <div id="system-tray">
            <span id="os-time">12:55 PM</span>
        </div>
    </div>

    <script>
        // Functie om de klok te updaten
        function updateTime() {
            const now = new Date();
            // Gebruik een neutrale tijdweergave
            const timeString = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('os-time').textContent = timeString;
        }

        setInterval(updateTime, 1000);
        updateTime();

        // Simpele functionaliteit om het welkomstvenster te sluiten
        document.querySelector('.close-btn').addEventListener('click', function() {
            document.getElementById('welcome-window').style.display = 'none';
        });
    </script>
</body>
</html>
