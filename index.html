<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web OS - Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Desktop -->
    <div id="desktop">

        <!-- Welkom venster -->
        <div class="window" id="welcome-window">
            <div class="title-bar">
                <span class="window-title">✨ Welkom in Web OS</span>
                <div class="controls">
                    <button class="close-btn">×</button>
                </div>
            </div>

            <div class="content">
                <p>Dit is de Web OS interface. Voeg hier je eigen app-content toe.</p>
            </div>
        </div>

        <!-- Desktop iconen -->
        <div class="desktop-icon" style="top: 20px; left: 20px;">
            <img src="icons/folder.png" alt="Mijn Documenten" class="icon-image">
            <span>Mijn Documenten</span>
        </div>

        <div class="desktop-icon" style="top: 120px; left: 20px;">
            <img src="icons/browser.png" alt="Web Browser" class="icon-image">
            <span>Web Browser</span>
        </div>

    </div>

    <!-- Taskbar -->
    <div id="taskbar">

        <div id="taskbar-icons">

            <button id="start-button" class="taskbar-button">
                <img src="icons/start-vloeibaar.png" alt="Start" class="icon-image">
            </button>

            <button class="taskbar-app-icon active">
                <img src="icons/settings.png" alt="Instellingen" class="icon-image">
            </button>

            <button class="taskbar-app-icon">
                <img src="icons/music.png" alt="Muziek" class="icon-image">
            </button>

        </div>

        <!-- System tray -->
        <div id="system-tray">
            <span id="os-time">--:--</span>
        </div>

    </div>

    <script>
        // Tijd update
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('nl-NL', {
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('os-time').textContent = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Venster sluiten
        document.querySelector('.close-btn').addEventListener('click', () => {
            document.getElementById('welcome-window').style.display = 'none';
        });
    </script>

</body>
</html>
