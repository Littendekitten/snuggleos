<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web OS - Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="desktop">
        <div class="window" id="welcome-window">
            <div class="title-bar">
                <span>Welkom in Web OS</span>
                <div class="controls">
                    <button class="close-btn">X</button>
                </div>
            </div>
            <div class="content">
                <p>Dit is een demo van de interface van je nieuwe OS, gebouwd met HTML en CSS!</p>
                <p>Je kunt dit venster slepen met JavaScript.</p>
            </div>
        </div>

    </div>

    <div id="taskbar">
        <div id="start-button">
            <div class="liquid-squares">
                <div class="square top-left"></div>
                <div class="square top-right"></div>
                <div class="square bottom-left"></div>
                <div class="square bottom-right"></div>
            </div>
        </div>

        <div id="system-tray">
            <span id="os-time">11:56</span>
        </div>
    </div>

    <script>
        // Functie om de klok te updaten
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('os-time').textContent = timeString;
        }

        // Update de tijd elke seconde
        setInterval(updateTime, 1000);
        updateTime(); // Eerste aanroep om direct de tijd te tonen

        // Simpele functionaliteit om het welkomstvenster te sluiten
        document.querySelector('.close-btn').addEventListener('click', function() {
            document.getElementById('welcome-window').style.display = 'none';
        });

        // HIER KOMT MEER COMPLEXE JAVASCRIPT VOOR SLEPEN EN KLIKKEN LATER
    </script>
</body>
</html>
